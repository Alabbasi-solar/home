<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الذكية | شركة العباسي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); }
    </style>
</head>
<body class="p-6 md:p-12 flex items-center justify-center min-h-screen">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-box" class="max-w-md w-full glass p-8 rounded-3xl border border-amber-500/40 shadow-2xl text-center space-y-6">
        <div class="w-16 h-16 rounded-2xl bg-amber-500/10 flex items-center justify-center text-amber-400 text-3xl mx-auto">🔒</div>
        <div>
            <h1 class="text-2xl font-black text-amber-400 mb-2">لوحة تحكم شركة العباسي</h1>
            <p class="text-slate-400 text-sm">أدخل كلمة السر للدخول (abbasi2026)</p>
        </div>
        <div class="space-y-4">
            <input id="password-input" type="password" placeholder="كلمة السر..." class="w-full bg-slate-900/90 border border-slate-700 p-3.5 rounded-xl focus:border-amber-500 outline-none text-center text-lg tracking-widest" onkeyup="if(event.key === 'Enter') checkPassword()">
            <button onclick="checkPassword()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl transition shadow-lg text-base">دخول</button>
            <p id="error-msg" class="text-red-400 text-xs hidden font-bold">كلمة السر غير صحيحة!</p>
        </div>
    </div>

    <!-- لوحة التحكم الاحترافية -->
    <div id="admin-panel" class="max-w-4xl w-full glass p-8 md:p-12 rounded-3xl border border-amber-500/40 shadow-2xl space-y-8 hidden">
        <div class="flex justify-between items-center border-b border-slate-800 pb-6">
            <h1 class="text-3xl font-black text-amber-400">لوحة تحكم موقع العباسي</h1>
            <div class="flex gap-3">
                <button onclick="logout()" class="bg-red-500/20 text-red-400 px-4 py-2 rounded-xl text-xs font-bold">خروج 🔒</button>
                <a href="index.html" target="_blank" class="bg-amber-500 text-slate-950 px-4 py-2 rounded-xl text-sm font-bold">عرض الموقع 🌐</a>
            </div>
        </div>

        <!-- المعرض -->
        <div class="space-y-4">
            <h2 class="text-xl font-bold text-amber-300">إدارة المعرض</h2>
            <input id="g-title" type="text" placeholder="عنوان المعرض (بالعربية)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl">
            <textarea id="g-desc" rows="2" placeholder="وصف المعرض (بالعربية)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl"></textarea>
            <textarea id="g-images" rows="3" placeholder="روابط صور المعرض (كل رابط في سطر)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-left" dir="ltr"></textarea>
        </div>

        <hr class="border-slate-800">

        <!-- المقال التقني -->
        <div class="space-y-4">
            <h2 class="text-xl font-bold text-amber-300">إدارة المقال التقني</h2>
            <input id="art-title" type="text" placeholder="عنوان المقال (بالعربية)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl">
            <textarea id="art-content" rows="5" placeholder="محتوى المقال بالتفصيل (بالعربية)..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl"></textarea>
        </div>

        <hr class="border-slate-800">

        <!-- إدارة مشاريع الولايات -->
        <div class="space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-amber-300">إدارة مشاريع الولايات</h2>
                <button onclick="addProjectField()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold">+ إضافة ولاية جديدة</button>
            </div>
            
            <div id="projects-container" class="space-y-4"></div>
        </div>

        <button onclick="saveChanges()" id="save-btn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-4 rounded-2xl transition text-lg shadow-xl">
            حفظ وترجمة النشر تلقائياً ✨
        </button>
    </div>

    <script>
        const ADMIN_PASSWORD = "abbasi2026";
        window.onload = () => { if (sessionStorage.getItem('logged') === 'true') showPanel(); }
        
        function checkPassword() {
            if (document.getElementById('password-input').value === ADMIN_PASSWORD) {
                sessionStorage.setItem('logged', 'true');
                showPanel();
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        function showPanel() {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            let data = JSON.parse(localStorage.getItem('abbasi_cms'));
            if (data) {
                document.getElementById('g-title').value = data.galleryTitle || "";
                document.getElementById('g-desc').value = data.galleryDesc || "";
                if (data.galleryImages) document.getElementById('g-images').value = data.galleryImages.join('\n');
                document.getElementById('art-title').value = data.articleTitle || "";
                document.getElementById('art-content').value = data.articleContent || "";
                
                const container = document.getElementById('projects-container');
                container.innerHTML = '';
                // يعرض فقط المشاريع الموجودة فعلياً في التخزين دون إضافة قيم افتراضية من عنده
                if (data.posts && data.posts.length > 0) {
                    data.posts.forEach(p => addProjectField(p.title, p.img, p.desc));
                }
            }
        }

        function addProjectField(title = "", img = "", desc = "") {
            const container = document.getElementById('projects-container');
            const div = document.createElement('div');
            div.className = "glass p-4 rounded-2xl space-y-3 border border-slate-700 relative";
            div.innerHTML = `
                <button onclick="this.parentElement.remove()" class="absolute top-3 left-3 text-red-400 text-xs font-bold">حذف ❌</button>
                <input type="text" placeholder="اسم الولاية (مثال: ولاية الجزيرة)" class="proj-title w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm" value="${title}">
                <input type="text" placeholder="رابط صورة الولاية" class="proj-img w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm text-left" dir="ltr" value="${img}">
                <textarea rows="2" placeholder="وصف المشروع في الولاية..." class="proj-desc w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm">${desc}</textarea>
            `;
            container.appendChild(div);
        }

        function logout() { sessionStorage.removeItem('logged'); location.reload(); }

        async function translateText(text) {
            if (!text) return "";
            try {
                let res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ar|en`);
                let json = await res.json();
                return json.responseData.translatedText || text;
            } catch (e) {
                return text;
            }
        }

        async function saveChanges() {
            const btn = document.getElementById('save-btn');
            btn.innerText = "جاري الترجمة والحفظ التلقائي... ⏳";
            btn.disabled = true;

            let gTitleAr = document.getElementById('g-title').value;
            let gDescAr = document.getElementById('g-desc').value;
            let artTitleAr = document.getElementById('art-title').value;
            let artContentAr = document.getElementById('art-content').value;

            let posts = [];
            const projectBoxes = document.querySelectorAll('#projects-container > div');
            for (let box of projectBoxes) {
                let pTitle = box.querySelector('.proj-title').value;
                let pImg = box.querySelector('.proj-img').value;
                let pDesc = box.querySelector('.proj-desc').value;
                
                posts.push({
                    title: pTitle,
                    titleEn: await translateText(pTitle),
                    img: pImg,
                    desc: pDesc,
                    descEn: await translateText(pDesc)
                });
            }

            let data = {
                galleryTitle: gTitleAr,
                galleryTitleEn: await translateText(gTitleAr),
                galleryDesc: gDescAr,
                galleryDescEn: await translateText(gDescAr),
                galleryImages: document.getElementById('g-images').value.split('\n').map(s => s.trim()).filter(Boolean),
                articleTitle: artTitleAr,
                articleTitleEn: await translateText(artTitleAr),
                articleContent: artContentAr,
                articleContentEn: await translateText(artContentAr),
                posts: posts,
                lastUpdated: Date.now()
            };

            localStorage.setItem('abbasi_cms', JSON.stringify(data));
            
            btn.innerText = "حفظ ونشر التغييرات ✨";
            btn.disabled = false;
            alert('تم حفظ وترجمة التغييرات ومشاريع الولايات بنجاح تام! 🚀');
        }
    </script>
</body>
</html>
